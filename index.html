<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1f3a">

    <title>PEACE CRM | Coming Soon</title>
    <meta name="description" content="PEACE CRM, modern church management software. Coming soon.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #0b1f3a;
            color: #f3f6fa;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: clamp(24px, 5vw, 56px);
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .circles {
            position: absolute;
            right: -8vmin;
            top: 50%;
            width: min(78vmin, 760px);
            transform: translateY(-58%);
            pointer-events: none;
        }

        .circles circle {
            mix-blend-mode: screen;
        }

        header,
        main,
        footer {
            position: relative;
            z-index: 1;
        }

        .wordmark {
            font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: -0.01em;
        }

        main {
            max-width: 900px;
        }

        h1 {
            font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
            font-weight: 700;
            font-size: clamp(46px, 10.5vw, 132px);
            line-height: 0.96;
            letter-spacing: -0.035em;
            max-width: 9em;
        }

        .lead {
            margin-top: 28px;
            max-width: 32em;
            font-size: clamp(16px, 2vw, 19px);
            line-height: 1.6;
            color: #b9c8dc;
        }

        .soon {
            display: inline-block;
            margin-top: 32px;
            padding-top: 14px;
            border-top: 2px solid #2bb3a3;
            font-weight: 500;
            font-size: 17px;
        }

        footer {
            margin-top: 56px;
            font-size: 13px;
            color: #7f93ae;
        }

        @media (max-width: 640px) {
            .circles {
                width: 120vw;
                right: -45vw;
                top: 4%;
                transform: none;
                opacity: 0.8;
            }
        }
    </style>
</head>

<body>
    <svg class="circles" viewBox="0 0 400 400" aria-hidden="true">
        <circle cx="150" cy="170" r="130" fill="#1b4f94" />
        <circle cx="255" cy="150" r="100" fill="#1f9f93" />
        <circle cx="215" cy="262" r="78" fill="#e9a23b" fill-opacity="0.85" />
    </svg>

    <header>
        <div class="wordmark">PEACE CRM</div>
    </header>

    <main>
        <h1>A calmer way to run your church.</h1>
        <p class="lead">
            Something new is on its way. We’re putting the final touches on
            software that helps churches stay close to their people and keep
            everyday work simple.
        </p>
        <div class="soon">Coming soon</div>
    </main>

    <footer>
        &copy; <span id="year">2026</span> PEACE CRM. All rights reserved.
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>

</html>
